[tool.dagster]
module_name = "fraudsentry_dagster.definitions"

[project]
name = "fraudsentry_dagster"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "dagster>=1.7.0",
    "dagster-dbt>=0.23.0",
    "dagster-webserver>=1.7.0",
    "boto3>=1.34.0",
    "databricks-sdk>=0.28.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
