version: 2

models:
  - name: stg_transactions
    description: Cleaned transaction records, one row per transaction.
    columns:
      - name: transaction_id
        tests:
          - unique
          - not_null
      - name: account_id
        tests:
          - not_null
      - name: amount
        tests:
          - not_null
      - name: is_fraud
        tests:
          - not_null
          - accepted_values:
              values: [0, 1]
      - name: merchant_category
        tests:
          - accepted_values:
              values:
                - grocery
                - electronics
                - travel
                - dining
                - fuel
                - entertainment
                - utilities
                - healthcare
                - clothing
                - online_retail
